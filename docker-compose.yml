services:
  client:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      HSI_DATA_DIR: /app/data
      MONGO_URI: mongodb://mongo:27017/hsi-studio
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: hsi-cubes
    volumes:
      - uploads-data:/app/uploads
      - ml-artifacts:/app/app/artifacts
      - server-data:/app/data
    depends_on:
      - mongo
      - redis
      - ml
      - minio
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml-service
    volumes:
      - uploads-data:/app/uploads
      - ml-cache:/app/app/cache
      - ml-artifacts:/app/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
  ml-cache:
  uploads-data:
  ml-artifacts:
  server-data:
